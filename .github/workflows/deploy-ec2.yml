name: Deploy tagged release to EC2

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing semantic-version image tag to deploy or roll back to
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: milobroker-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, publish and deploy release
    runs-on: ubuntu-latest
    environment: production
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies and verify production build
        run: |
          npm ci
          npm run build

      - name: Validate stable version tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable semantic version tag such as v1.2.3; got $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "$GITHUB_REF_NAME" ]]; then
            echo "For manual deploy/rollback, select the same release tag as the workflow ref." >&2
            exit 1
          fi
          release_commit=$(git rev-parse "$RELEASE_TAG^{commit}")
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "Production release tags must point to a commit already merged into main." >&2
            exit 1
          fi

      - name: Wait for successful CI on this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_commit=$(git rev-parse "$RELEASE_TAG^{commit}")

          for attempt in {1..90}; do
            runs=$(gh run list \
              --workflow ci.yml \
              --commit "$release_commit" \
              --json databaseId,headSha,status,conclusion \
              --limit 20)
            run=$(printf '%s' "$runs" | jq -c --arg sha "$release_commit" '[.[] | select(.headSha == $sha)][0] // empty')

            if [[ -z "$run" ]]; then
              echo "Waiting for CI run to start for $release_commit..."
              sleep 10
              continue
            fi

            status=$(printf '%s' "$run" | jq -r '.status')
            conclusion=$(printf '%s' "$run" | jq -r '.conclusion // ""')
            if [[ "$status" == completed ]]; then
              if [[ "$conclusion" == success ]]; then
                echo "CI passed for release commit $release_commit."
                exit 0
              fi
              echo "CI finished with conclusion '$conclusion'; deployment is blocked." >&2
              exit 1
            fi

            echo "CI is $status for $release_commit; waiting..."
            sleep 10
          done

          echo "Timed out waiting for CI on $release_commit; deployment is blocked." >&2
          exit 1

      - name: Configure short-lived AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sign in to Amazon ECR
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

      - name: Build and publish image for a newly pushed release tag
        if: github.event_name == 'push'
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          image="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$RELEASE_TAG"
          docker build --platform linux/amd64 --tag "$image" .
          docker push "$image"
          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$RELEASE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text

      - name: Confirm the requested release image exists in ECR
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$RELEASE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text

      - name: Deploy image to EC2 using Systems Manager
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        shell: bash
        run: |
          set -euo pipefail

          registry="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          image="$registry/$ECR_REPOSITORY:$RELEASE_TAG"
          remote_script=$(cat <<EOF
          set -Eeuo pipefail
          region='$AWS_REGION'
          registry='$registry'
          image='$image'
          aws ecr get-login-password --region "\$region" | docker login --username AWS --password-stdin "\$registry"
          docker pull "\$image"
          previous_image=\$(docker inspect --format '{{.Config.Image}}' milobroker 2>/dev/null || true)
          docker rm --force milobroker >/dev/null 2>&1 || true
          if ! docker run --detach --name milobroker --restart unless-stopped --publish 127.0.0.1:8080:8080 "\$image"; then
            docker rm --force milobroker >/dev/null 2>&1 || true
            if [[ -n "\$previous_image" ]]; then
              docker run --detach --name milobroker --restart unless-stopped --publish 127.0.0.1:8080:8080 "\$previous_image"
            fi
            exit 1
          fi
          healthy=false
          for attempt in {1..30}; do
            health=\$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' milobroker 2>/dev/null || true)
            if [[ "\$health" == healthy ]]; then healthy=true; break; fi
            if [[ "\$health" == unhealthy || "\$health" == missing ]]; then break; fi
            sleep 2
          done
          if [[ "\$healthy" == true ]]; then
            echo 'New container passed its Docker health check.'
            exit 0
          fi
          docker logs milobroker || true
          docker rm --force milobroker >/dev/null 2>&1 || true
          if [[ -n "\$previous_image" ]]; then
            echo "Restoring previous image: \$previous_image"
            docker run --detach --name milobroker --restart unless-stopped --publish 127.0.0.1:8080:8080 "\$previous_image"
          fi
          exit 1
          EOF
          )

          encoded_script=$(printf '%s' "$remote_script" | base64 --wrap=0)
          ssm_command="printf '%s' '$encoded_script' | base64 --decode | bash"
          parameters=$(jq -cn --arg command "$ssm_command" '{commands: [$command]}')
          command_id=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy MiloBroker $RELEASE_TAG" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)

          for attempt in {1..60}; do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)
            case "$status" in
              Success)
                echo "EC2 deployment succeeded for $RELEASE_TAG."
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
                  --output json || true
                exit 1
                ;;
              *) sleep 10 ;;
            esac
          done

          echo "Timed out waiting for SSM command $command_id" >&2
          exit 1
