version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - npm ci
  build:
    commands:
      - npm run build          # outputs to ./dist or ./build
  post_build:
    commands:
      # Sync build output to S3
      - aws s3 sync ./dists3://milobroker-public-site-084767318881-ap-southeast-2-an --delete
      # Invalidate CloudFront cache so changes go live immediately
      - aws cloudfront create-invalidation --distribution-id E1AKHJV8BTP0U1 --paths "/*"

artifacts:
  files:
    - '**/*'
  base-directory: dist
