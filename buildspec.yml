version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - npm ci
  build:
    commands:
      - npm run build          # outputs to ./dist or ./build
  post_build:
    commands:
      # Sync build output to S3
      - aws s3 sync ./dist s3://codepipeline-ap-southeast-2-4d050e68ff2d-40e1-9e20-dfd9b0b9a209 --delete
      # Invalidate CloudFront cache so changes go live immediately
      - aws cloudfront create-invalidation --distribution-id E1AKHJV8BTP0U1 --paths "/*"

artifacts:
  files:
    - '**/*'
  base-directory: dist
